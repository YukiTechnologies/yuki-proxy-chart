app:
  name: 'yuki-duckdb'
  group: default-app-group
  # Scaled out, not up: DuckDB throughput degrades non-linearly under heavy
  # single-node concurrency, so add pods rather than cores per pod.
  replicaCount: 3
  # Worker threads per pod. Must track resources.limits.cpu — DuckDB sizes its
  # thread pool from the node's core count, not from the cgroup limit.
  threads: 2
  # httpserver bearer token, shared by every pod in the pool. Leave empty and
  # the chart reuses the value already in the Secret, or mints one on first
  # install; the proxy reads it from that same Secret, so nobody has to know it.
  apiKey: ""
  container:
    image: 406122784773.dkr.ecr.us-east-1.amazonaws.com/duckdb:duckpy1
    port: 80

  service:
    port: 80
    prometheus:
      enabled: false

serviceAccount:
  roleARN: arn:aws:iam::406122784773:role/yuki-duckdb-role
  serviceAccountName: 'yuki-duckdb-sa'

resources:
  requests:
    memory: "1Gi"
    cpu: "500m"
  limits:
    memory: "2Gi"
    cpu: "2"

affinity: {}
tolerations: []
