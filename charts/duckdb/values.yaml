app:
  name: 'yuki-duckdb'
  group: default-app-group
  # Scale out, not up: throughput degrades non-linearly under single-node concurrency.
  replicaCount: 3
  # Must track resources.limits.cpu — DuckDB sizes its thread pool from node cores.
  threads: 2
  # Empty reuses the key already in the Secret, or mints one. The proxy reads it from there.
  apiKey: ""
  container:
    image: 406122784773.dkr.ecr.us-east-1.amazonaws.com/duckdb:duckpy1
    port: 80

  service:
    port: 80
    prometheus:
      enabled: false

serviceAccount:
  roleARN: arn:aws:iam::406122784773:role/yuki-duckdb-role
  serviceAccountName: 'yuki-duckdb-sa'

resources:
  requests:
    memory: "1Gi"
    cpu: "500m"
  limits:
    memory: "2Gi"
    cpu: "2"

affinity: {}
tolerations: []
