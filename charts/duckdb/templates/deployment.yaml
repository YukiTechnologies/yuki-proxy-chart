{{- if .Values.app.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.app.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.app.name }}
    app.kubernetes.io/version: {{ .Release.Name }}-{{ .Release.Revision }}
    app: {{ .Values.app.name }}
    group: {{ .Values.app.group }}
spec:
  replicas: {{ .Values.app.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Values.app.name }}
  template:
    metadata:
      namespace: {{ .Release.Namespace }}
      annotations:
        # .duckdbrc is mounted with subPath, which never picks up Secret updates — without
        # this a changed threads/port/apiKey would sit unread until a pod happened to restart.
        checksum/config: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
      labels:
        app: {{ .Values.app.name }}
        group: {{ .Values.app.group }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.serviceAccountName | default "default" }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: duckdbrc
          secret:
            secretName: {{ .Values.app.name }}-secret
            items:
              - key: .duckdbrc
                path: .duckdbrc
      containers:
        - name: {{ .Values.app.name }}
          image: {{ .Values.app.container.image }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: {{ .Values.app.container.port }}
              name: duckdb-http
          volumeMounts:
            - name: duckdbrc
              mountPath: /home/duckdb/.duckdbrc
              subPath: .duckdbrc
              readOnly: true
          readinessProbe:
            httpGet:
              path: /ping
              port: duckdb-http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ping
              port: duckdb-http
            initialDelaySeconds: 15
            periodSeconds: 10
{{- end }}
