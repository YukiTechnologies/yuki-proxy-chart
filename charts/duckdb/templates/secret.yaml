{{- /* Reuse the key already in the cluster, so `helm upgrade` doesn't roll the
       pool's bearer token out from under the proxy mid-release. */}}
{{- $secretName := printf "%s-secret" .Values.app.name }}
{{- $apiKey := .Values.app.apiKey }}
{{- if not $apiKey }}
{{-   $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{-   $existingData := dict }}
{{-   if $existing }}{{ $existingData = ($existing.data | default dict) }}{{ end }}
{{-   if hasKey $existingData "api-key" }}
{{-     $apiKey = index $existingData "api-key" | b64dec }}
{{-   else }}
{{-     $apiKey = randAlphaNum 32 }}
{{-   end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.app.name }}
    app.kubernetes.io/version: {{ .Release.Name }}-{{ .Release.Revision }}
    app: {{ .Values.app.name }}
    group: {{ .Values.app.group }}
data:
  api-key: {{ $apiKey | b64enc }}
  .duckdbrc: {{ list
    ".mode trash"
    "INSTALL httpserver FROM community;"
    "INSTALL iceberg;"
    "INSTALL httpfs;"
    "LOAD httpserver;"
    (printf "SET threads=%d;" (int64 .Values.app.threads))
    "CREATE OR REPLACE SECRET secret (TYPE s3, PROVIDER credential_chain);"
    (printf "SELECT httpserve_start('0.0.0.0', %d, '%s');" (int64 .Values.app.container.port) $apiKey)
    | join "\n" | b64enc }}
