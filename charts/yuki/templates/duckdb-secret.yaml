{{- if and .Values.fabric.enabled .Values.fabric.engines.duckdb.deploy }}
{{- $duckdb := .Values.fabric.engines.duckdb }}
{{- $secretName := printf "%s-secret" $duckdb.name }}
{{- /* Reuse the key already in the cluster, so `helm upgrade` doesn't roll it under the proxy. */}}
{{- $apiKey := $duckdb.apiKey }}
{{- if not $apiKey }}
{{-   $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{-   $existingData := dict }}
{{-   if $existing }}{{ $existingData = ($existing.data | default dict) }}{{ end }}
{{-   if hasKey $existingData "api-key" }}
{{-     $apiKey = index $existingData "api-key" | b64dec }}
{{-   else }}
{{-     $apiKey = randAlphaNum 32 }}
{{-   end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    app.kubernetes.io/name: {{ $duckdb.name }}
    app.kubernetes.io/version: {{ .Release.Name }}-{{ .Release.Revision }}
    app: {{ $duckdb.name }}
    group: {{ .Values.app.group }}
data:
  api-key: {{ $apiKey | b64enc }}
  .duckdbrc: {{ list
    ".mode trash"
    "INSTALL httpserver FROM community;"
    "INSTALL iceberg;"
    "INSTALL httpfs;"
    "LOAD httpserver;"
    (printf "SET threads=%d;" (int64 $duckdb.threads))
    "CREATE OR REPLACE SECRET secret (TYPE s3, PROVIDER credential_chain);"
    (printf "SELECT httpserve_start('0.0.0.0', %d, '%s');" (int64 $duckdb.port) $apiKey)
    | join "\n" | b64enc }}
{{- end }}
