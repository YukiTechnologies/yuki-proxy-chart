{{- if and .Values.fabric.enabled .Values.fabric.engines.duckdb.deploy }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.fabric.engines.duckdb.name }}-secret
  labels:
    app.kubernetes.io/name: {{ .Values.fabric.engines.duckdb.name }}
    app.kubernetes.io/version: {{ .Release.Name }}-{{ .Release.Revision }}
    app: {{ .Values.fabric.engines.duckdb.name }}
    group: {{ .Values.app.group }}
data:
  init.sql: {{ include "proxy.duckdb.initSql" . | b64enc }}
{{- end }}
