{{- if and .Values.passthrough.enabled .Values.passthrough.watcher.enabled -}}
# Stable Service for health-checking the real proxy pods (never swapped).
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.app.name }}-direct
  labels:
    app: {{ .Values.app.name }}-passthrough
    group: {{ .Values.app.group }}
spec:
  # The ALB target-health readiness gate only turns true while the pods are ALB
  # targets, which they are not during passthrough; requiring Ready here would
  # keep the watcher from ever seeing a healthy proxy again.
  publishNotReadyAddresses: true
  selector:
    app: {{ .Values.app.name }}
  ports:
    - name: app
      port: {{ .Values.app.service.port }}
      targetPort: {{ .Values.app.container.port }}
{{- end }}
