{{- if and .Values.fabric.enabled .Values.fabric.engines.duckdb.deploy }}
{{- $duckdb := .Values.fabric.engines.duckdb }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $duckdb.name }}
  labels:
    app.kubernetes.io/name: {{ $duckdb.name }}
    app.kubernetes.io/version: {{ .Release.Name }}-{{ .Release.Revision }}
    app: {{ $duckdb.name }}
    group: {{ .Values.app.group }}
spec:
  replicas: {{ $duckdb.replicaCount }}
  selector:
    matchLabels:
      app: {{ $duckdb.name }}
  template:
    metadata:
      annotations:
        # subPath mounts never see Secret updates, so roll pods when .duckdbrc changes.
        checksum/config: {{ include (print $.Template.BasePath "/duckdb-secret.yaml") . | sha256sum }}
      labels:
        app: {{ $duckdb.name }}
        group: {{ .Values.app.group }}
    spec:
      serviceAccountName: {{ $duckdb.serviceAccountName | default "default" }}
      {{- with $duckdb.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $duckdb.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: duckdbrc
          secret:
            secretName: {{ $duckdb.name }}-secret
            items:
              - key: .duckdbrc
                path: .duckdbrc
      containers:
        - name: {{ $duckdb.name }}
          image: {{ $duckdb.image }}
          {{- with $duckdb.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: {{ $duckdb.port }}
              name: duckdb-http
          volumeMounts:
            - name: duckdbrc
              mountPath: /home/duckdb/.duckdbrc
              subPath: .duckdbrc
              readOnly: true
          readinessProbe:
            httpGet:
              path: /ping
              port: duckdb-http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ping
              port: duckdb-http
            initialDelaySeconds: 15
            periodSeconds: 10
{{- end }}
