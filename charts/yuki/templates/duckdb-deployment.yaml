{{- if and .Values.fabric.enabled .Values.fabric.engines.duckdb.deploy }}
{{- $duckdb := .Values.fabric.engines.duckdb }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $duckdb.name }}
  labels:
    app.kubernetes.io/name: {{ $duckdb.name }}
    app.kubernetes.io/version: {{ .Release.Name }}-{{ .Release.Revision }}
    app: {{ $duckdb.name }}
    group: {{ .Values.app.group }}
spec:
  replicas: {{ $duckdb.replicaCount }}
  selector:
    matchLabels:
      app: {{ $duckdb.name }}
  template:
    metadata:
      annotations:
        # Read once at startup.
        checksum/config: {{ include "proxy.duckdb.initSql" . | sha256sum }}
      labels:
        app: {{ $duckdb.name }}
        group: {{ .Values.app.group }}
    spec:
      serviceAccountName: {{ $duckdb.serviceAccountName | default "default" }}
      {{- with $duckdb.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $duckdb.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: init-sql
          secret:
            secretName: {{ $duckdb.name }}-secret
            items:
              - key: init.sql
                path: init.sql
      containers:
        - name: {{ $duckdb.name }}
          image: {{ $duckdb.image }}
          {{- with $duckdb.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          imagePullPolicy: IfNotPresent
          env:
            - name: DUCKDB_INIT_FILE
              value: /etc/duckling/init.sql
            - name: DUCKLING_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $duckdb.name }}-api-key
                  key: api-key
            {{- if (.Values.fabric.catalog | default dict).enabled }}
            - name: DUCKLING_CATALOG_ENDPOINT
              value: {{ include "proxy.fabric.catalogEndpoint" . | quote }}
            {{- end }}
          ports:
            # Duckling's fixed port; the Service maps $duckdb.port onto it.
            - containerPort: 9999
              name: duckdb-http
          volumeMounts:
            - name: init-sql
              mountPath: /etc/duckling
              readOnly: true
          readinessProbe:
            httpGet:
              path: /ping
              port: duckdb-http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ping
              port: duckdb-http
            initialDelaySeconds: 15
            periodSeconds: 10
{{- end }}
