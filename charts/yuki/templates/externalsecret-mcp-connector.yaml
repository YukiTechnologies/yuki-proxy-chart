{{- if .Values.mcpConnector.enabled }}
{{- $sharedSecret := printf "%s/mcp-connector-shared" (include "mcp.envShort" .) }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: yuki-mcp-connector-shared
  labels:
    app.kubernetes.io/name: yuki-mcp-connector
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: yuki-mcp-connector-shared
    creationPolicy: Owner
  data:
    {{- range list "postgres-url" "redis-user" "redis-password" "platform-token-encryption-key" }}
    - secretKey: {{ . }}
      remoteRef:
        key: {{ $sharedSecret | quote }}
        property: {{ . }}
    {{- end }}
{{- end }}
