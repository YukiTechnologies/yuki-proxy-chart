{{- if .Values.mcpConnector.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: yuki-mcp-connector
  labels:
    app.kubernetes.io/name: yuki-mcp-connector
  annotations:
    eks.amazonaws.com/role-arn: {{ required "mcpConnector.serviceAccount.roleArn is required when mcpConnector.enabled" .Values.mcpConnector.serviceAccount.roleArn | quote }}
{{- end }}
