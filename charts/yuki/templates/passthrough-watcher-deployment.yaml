{{- if and .Values.passthrough.enabled .Values.passthrough.watcher.enabled -}}
{{- if not .Values.passthrough.mode }}
{{- fail "passthrough.mode must be set (auto/forcePassthrough/forceProxy) when passthrough.watcher.enabled is true" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.app.name }}-passthrough-watcher
  labels:
    app: {{ .Values.app.name }}-passthrough-watcher
    group: {{ .Values.app.group }}
spec:
  # Single instance by design — one controller deciding the Service selector, not one per passthrough pod.
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Values.app.name }}-passthrough-watcher
  template:
    metadata:
      labels:
        app: {{ .Values.app.name }}-passthrough-watcher
        group: {{ .Values.app.group }}
      annotations:
        # Rolls the pod whenever the ConfigMap changes — watch.sh only reads it at start.
        checksum/config: {{ include (print $.Template.BasePath "/passthrough-watcher-configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ .Values.app.name }}-passthrough-watcher
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
      containers:
        - name: watcher
          image: {{ .Values.passthrough.watcher.image }}
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "/etc/bypass/watch.sh"]
          env:
            # Logged on every line so an alert identifies the customer, not just the namespace.
            - name: COMPANY_NAME
              value: {{ .Values.app.container.env.COMPANY_NAME | default "" | quote }}
            - name: ACCOUNT_GUID
              value: {{ .Values.app.container.env.ACCOUNT_GUID | default "" | quote }}
            - name: COMPANY_GUID
              value: {{ .Values.app.container.env.COMPANY_GUID | default "" | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: watcher-config
              mountPath: /etc/bypass
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            # ponytail: 3m window — worst case a loop iteration burns ~65s on curl retries
            # (2x reads x up to 2x(10s timeout+1 retry) + sleeps), so 1m was too tight.
            exec:
              command: ["sh", "-c", "test -n \"$(find /tmp/heartbeat -mmin -3 2>/dev/null)\""]
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 2
          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
            limits:
              memory: "32Mi"
      volumes:
        - name: watcher-config
          configMap:
            name: {{ .Values.app.name }}-passthrough-watcher
        - name: tmp
          emptyDir:
            sizeLimit: 4Mi
{{- end }}
