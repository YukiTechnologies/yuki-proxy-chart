{{- $duckdb := .Values.fabric.engines.duckdb }}
{{- $catalog := $duckdb.catalog | default dict }}
{{- if and .Values.fabric.enabled $duckdb.deploy $catalog.enabled }}
{{- if not .Values.externalSecrets.enabled }}
{{- fail "externalSecrets.enabled must be true when fabric.engines.duckdb.catalog.enabled is true" }}
{{- end }}
{{- $secret := $catalog.secret | default dict }}
{{- $store := required "fabric.engines.duckdb.catalog.secret.store is required when the catalog is enabled" $secret.store }}
{{- if not (get (.Values.externalSecrets.stores | default dict) $store) }}
{{- fail (printf "fabric.engines.duckdb.catalog.secret.store %q is not defined in externalSecrets.stores" $store) }}
{{- end }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $duckdb.name }}-catalog
  labels:
    app.kubernetes.io/name: {{ $duckdb.name }}
    app.kubernetes.io/version: {{ .Release.Name }}-{{ .Release.Revision }}
    app: {{ $duckdb.name }}
    group: {{ .Values.app.group }}
spec:
  refreshInterval: 30s
  secretStoreRef:
    name: {{ .Values.app.name }}-aws-secretstore-{{ $store }}
    kind: SecretStore
  target:
    name: {{ $duckdb.name }}-catalog
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        token: "{{ `{{ .token }}` }}"
  data:
    - secretKey: token
      remoteRef:
        key: {{ required "fabric.engines.duckdb.catalog.secret.key is required when the catalog is enabled" $secret.key }}
        property: {{ required "fabric.engines.duckdb.catalog.secret.property is required when the catalog is enabled" $secret.property }}
{{- end }}
