{{- if .Values.redisSecret.create }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace "redis-encryption-key" }}
apiVersion: v1
kind: Secret
metadata:
  name: redis-encryption-key
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  # Reuse the live key so `helm upgrade` never rotates it out from under running pods.
  password: {{ if and $existing $existing.data.password }}{{ $existing.data.password | quote }}{{ else }}{{ randAlphaNum 32 | b64enc | quote }}{{ end }}
{{- end }}
