{{- with .Values.fabric.gateway }}
{{- if .enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .name }}
  labels:
    app.kubernetes.io/name: {{ .name }}
    app.kubernetes.io/version: {{ $.Release.Name }}-{{ $.Release.Revision }}
    app: {{ .name }}
    group: {{ $.Values.app.group }}
spec:
  replicas: {{ .replicaCount }}
  selector:
    matchLabels:
      app: {{ .name }}
  template:
    metadata:
      labels:
        app: {{ .name }}
        group: {{ $.Values.app.group }}
    spec:
      # The proxy's: it can read the Redis encryption key secret in AWS.
      serviceAccountName: {{ $.Values.serviceAccount.serviceAccountName | default "default" }}
      terminationGracePeriodSeconds: {{ .terminationGracePeriodSeconds }}
      {{- with .affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: gateway
          image: {{ required "fabric.gateway.image is required" .image }}
          imagePullPolicy: IfNotPresent
          env:
            - name: SNOWFLAKE_PROXY_URL
              value: http://{{ $.Values.app.name }}:{{ $.Values.app.service.port }}
            # Reads the proxy's sessions, so it takes the proxy's Redis settings and key.
            {{- range $key := list "REDIS_HOST" "REDIS_USER" "REDIS_PASSWORD" "AWS_REGION" }}
            {{- with index $.Values.app.container.env $key }}
            - name: {{ $key }}
              value: {{ . | quote }}
            {{- end }}
            {{- with index ($.Values.app.container.envFromSecrets | default dict) $key }}
            - name: {{ $key }}
              valueFrom:
                secretKeyRef:
                  name: {{ .name }}
                  key: {{ .key }}
            {{- end }}
            {{- end }}
            - name: REDIS_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: redis-encryption-key
                  key: password
            {{- range $key, $value := .env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          ports:
            - containerPort: {{ .port }}
              name: gateway-http
          {{- with .resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /fabric/health
              port: gateway-http
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /fabric/health
              port: gateway-http
            periodSeconds: 20
            timeoutSeconds: 2
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "{{ .drainSeconds }}"]
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .name }}
  labels:
    app.kubernetes.io/name: {{ .name }}
    app.kubernetes.io/version: {{ $.Release.Name }}-{{ $.Release.Revision }}
    app: {{ .name }}
    group: {{ $.Values.app.group }}
  annotations:
    # Wins over the Ingress-level path, which is the proxy's /health/ready.
    alb.ingress.kubernetes.io/healthcheck-path: /fabric/health
spec:
  type: ClusterIP
  selector:
    app: {{ .name }}
  ports:
    - name: gateway
      port: {{ .port }}
      targetPort: gateway-http
{{- end }}
{{- end }}
