{{- if and .Values.fabric.enabled .Values.fabric.engines.duckdb.deploy }}
{{- $duckdb := .Values.fabric.engines.duckdb }}
{{- if not .Values.externalSecrets.enabled }}
{{- fail "externalSecrets.enabled must be true when fabric.engines.duckdb.deploy is true" }}
{{- end }}
{{- $secret := $duckdb.apiKeySecret | default dict }}
{{- $store := required "fabric.engines.duckdb.apiKeySecret.store is required" $secret.store }}
{{- if not (get (.Values.externalSecrets.stores | default dict) $store) }}
{{- fail (printf "fabric.engines.duckdb.apiKeySecret.store %q is not defined in externalSecrets.stores" $store) }}
{{- end }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $duckdb.name }}-api-key
  labels:
    app.kubernetes.io/name: {{ $duckdb.name }}
    app.kubernetes.io/version: {{ .Release.Name }}-{{ .Release.Revision }}
    app: {{ $duckdb.name }}
    group: {{ .Values.app.group }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.app.name }}-aws-secretstore-{{ $store }}
    kind: SecretStore
  target:
    name: {{ $duckdb.name }}-api-key
    creationPolicy: Owner
  data:
    - secretKey: api-key
      remoteRef:
        key: {{ required "fabric.engines.duckdb.apiKeySecret.key is required" $secret.key }}
        property: {{ required "fabric.engines.duckdb.apiKeySecret.property is required" $secret.property }}
{{- end }}
