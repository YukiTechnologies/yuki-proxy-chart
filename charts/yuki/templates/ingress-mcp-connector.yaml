{{- if .Values.mcpConnector.enabled }}
{{- $host := include "mcpConnector.host" . }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: yuki-mcp-connector
  annotations:
    alb.ingress.kubernetes.io/certificate-arn: {{ required "mcpConnector.ingress.certificateArn is required when mcpConnector.enabled" .Values.mcpConnector.ingress.certificateArn | quote }}
    alb.ingress.kubernetes.io/load-balancer-name: {{ include "mcpConnector.loadBalancerName" . | quote }}
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}, {"HTTP":80}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-Res-2021-06
    alb.ingress.kubernetes.io/healthcheck-path: /health/live
    alb.ingress.kubernetes.io/target-group-attributes: deregistration_delay.timeout_seconds={{ .Values.mcpConnector.deregistrationDelaySeconds }}
    external-dns.alpha.kubernetes.io/hostname: {{ $host | quote }}
    {{- range $key, $value := .Values.mcpConnector.ingress.annotations }}
    {{ $key }}: {{ tpl (toString $value) $ | quote }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.mcpConnector.ingress.className }}
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: yuki-mcp-connector
                port:
                  number: 5170
{{- end }}
