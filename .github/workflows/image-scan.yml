name: Nightly image scan

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.ECR_GITHUB_IAM_ROLE }}
          role-session-name: GitHub_to_AWS_via_FederatedOIDC
          aws-region: us-east-1

      - name: Log in to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@v0.2.2
        with:
          version: v0.69.2

      # ponytail: parses values.yaml; subchart images (groundcover, external-secrets, starrocks) are vendor-owned and skipped
      - name: Scan every image pinned in values.yaml
        run: |
          rc=0
          for i in $(grep -hoE '^\s+image: *[^ #"]+' charts/yuki/values.yaml | awk '{print $2}' | sort -u); do
            echo "::group::$i"
            trivy image -q --scanners vuln --ignore-unfixed --exit-code 1 "$i" || { rc=1; echo "::error::$i has fixable CVEs"; }
            echo "::endgroup::"
          done
          exit $rc

      - name: Notify Slack on failure
        if: failure()
        uses: 8398a7/action-slack@v3
        with:
          status: failure
          fields: repo,workflow
          author_name: Nightly image scan found fixable CVEs
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
